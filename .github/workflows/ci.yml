name: CI

on:
  push:
  pull_request:
  workflow_dispatch:   # "Run workflow" in the Actions tab: OTA test images of any branch

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install platformio cryptography pillow

      - name: Unit tests (host)
        run: pio test -e native

      - name: Build firmware
        run: pio run -e esp01_1m

      - name: Build debug firmware
        run: pio run -e esp01_1m_debug

      - name: Build filesystem image
        run: pio run -e esp01_1m -t buildfs

      # The manual's pictures of the picture screens and the report come from a host build of display.cpp:
      # make sure it still compiles and runs (the pictures themselves are not checked)
      - name: Manual pictures build from the drawing code
        run: python tools/screen_pictures.py --out "$RUNNER_TEMP/pictures"

      - name: Firmware leaves room for an over-the-air update
        run: |
          ld=$(sed -n 's/^board_build.ldscript *= *//p' platformio.ini)
          python tools/ota_tool.py check-size --in .pio/build/esp01_1m/firmware.bin --ldscript "$ld"

      # Installable images to try on a device before tagging a release (web UI: Firmware update ->
      # Manual upload). Only for main and manual runs, so not every branch push gets a signed image.
      # They are not published: devices never install them by themselves.
      - name: OTA test images
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        env:
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
        run: |
          fwbin=.pio/build/esp01_1m/firmware.bin
          mkdir -p ota-test
          if [ -n "$OTA_SIGNING_KEY" ]; then
            key="$RUNNER_TEMP/ota.pem"
            trap 'rm -f "$key"' EXIT
            printf '%s\n' "$OTA_SIGNING_KEY" > "$key"
            python tools/ota_tool.py check-key --key "$key"
            python tools/ota_tool.py sign --key "$key" --in "$fwbin" --out ota-test/dayspeck.bin.gz
            signed=signed
          else
            echo "::warning::OTA_SIGNING_KEY is not set: the test images are unsigned and only install on a build without a key"
            gzip -9 -n -c "$fwbin" > ota-test/dayspeck.bin.gz
            signed=unsigned
          fi
          fw=$(sed -n 's/^#define FW_VERSION "\(.*\)"/\1/p' firmware/include/version.h)
          printf 'Dayspeck %s, commit %s (%s), %s\nNot a release: install with Firmware update -> Manual upload.\n' \
            "$fw" "${GITHUB_SHA::7}" "$GITHUB_REF_NAME" "$signed" > ota-test/BUILD.txt
          cat ota-test/BUILD.txt

      - name: Upload OTA test images
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ota-test-images
          path: ota-test/

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            .pio/build/esp01_1m/firmware.bin
            .pio/build/esp01_1m/littlefs.bin

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r tools/requirements-dev.txt
      - name: Lint tools (syntax errors, undefined names, unused imports)
        run: ruff check tools --select E9,F63,F7,F82,F401,F811
      - name: Tests
        run: cd tools && python -m pytest tests
      - name: bitmaps.h matches its PNG sources
        run: cd tools && python -m bitmaptool regen assets/manifest.json --check
