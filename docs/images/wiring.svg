<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Dayspeck wiring diagram</title>
  <desc id="d">ESP-01 GPIO2 goes to the OLED SCL, GPIO0 to the OLED SDA, RX (GPIO3) to the touch sensor output. VCC and CH_PD go to 3.3 V, GND to ground.</desc>
  <rect x="1" y="1" width="758" height="398" rx="10" fill="#ffffff" stroke="#c8ccd0"/>
  <g fill="none" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <!-- SCL -->
    <polyline points="210,190 330,190 330,150 500,150" stroke="#1565c0"/>
    <!-- SDA -->
    <polyline points="210,230 360,230 360,180 500,180" stroke="#2e7d32"/>
    <!-- touch -->
    <polyline points="210,300 400,300 400,310 500,310" stroke="#ef6c00"/>
  </g>
  <!-- power stubs -->
  <g stroke-width="3" stroke-linecap="round">
    <line x1="210" y1="90" x2="250" y2="90" stroke="#c62828"/>
    <line x1="210" y1="130" x2="250" y2="130" stroke="#c62828"/>
    <line x1="210" y1="340" x2="250" y2="340" stroke="#333"/>
    <line x1="460" y1="90" x2="500" y2="90" stroke="#333"/>
    <line x1="460" y1="120" x2="500" y2="120" stroke="#c62828"/>
    <line x1="460" y1="280" x2="500" y2="280" stroke="#c62828"/>
    <line x1="460" y1="340" x2="500" y2="340" stroke="#333"/>
  </g>
  <g font-size="12" font-weight="bold" text-anchor="middle" fill="#fff">
    <rect x="250" y="80" width="46" height="20" rx="4" fill="#c62828"/><text x="273" y="94">3.3 V</text>
    <rect x="250" y="120" width="46" height="20" rx="4" fill="#c62828"/><text x="273" y="134">3.3 V</text>
    <rect x="250" y="330" width="46" height="20" rx="4" fill="#333"/><text x="273" y="344">GND</text>
    <rect x="414" y="80" width="46" height="20" rx="4" fill="#333"/><text x="437" y="94">GND</text>
    <rect x="414" y="110" width="46" height="20" rx="4" fill="#c62828"/><text x="437" y="124">3.3 V</text>
    <rect x="414" y="270" width="46" height="20" rx="4" fill="#c62828"/><text x="437" y="284">3.3 V</text>
    <rect x="414" y="330" width="46" height="20" rx="4" fill="#333"/><text x="437" y="344">GND</text>
  </g>
  <!-- ESP-01 -->
  <rect x="40" y="50" width="170" height="320" rx="8" fill="#eef2f6" stroke="#555" stroke-width="2"/>
  <text x="56" y="78" text-anchor="start" font-size="18" font-weight="bold" fill="#222">ESP-01</text>
  <text x="56" y="96" text-anchor="start" font-size="12" fill="#555">ESP8266, 1 MB</text>
  <g font-size="13" fill="#222" text-anchor="end">
    <text x="196" y="94">VCC</text>
    <text x="196" y="134">CH_PD (EN)</text>
    <text x="196" y="194">GPIO2</text>
    <text x="196" y="234">GPIO0</text>
    <text x="196" y="304">RX (GPIO3)</text>
    <text x="196" y="344">GND</text>
  </g>
  <!-- OLED -->
  <rect x="500" y="50" width="200" height="160" rx="8" fill="#eef2f6" stroke="#555" stroke-width="2"/>
  <text x="600" y="38" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">SSD1306 OLED</text>
  <text x="620" y="105" text-anchor="middle" font-size="12" fill="#555">128×64, I²C</text>
  <text x="620" y="121" text-anchor="middle" font-size="12" fill="#555">address 0x3C</text>
  <g font-size="13" fill="#222">
    <text x="510" y="94">GND</text>
    <text x="510" y="124">VCC</text>
    <text x="510" y="154" fill="#1565c0" font-weight="bold">SCL</text>
    <text x="510" y="184" fill="#2e7d32" font-weight="bold">SDA</text>
  </g>
  <!-- Touch -->
  <rect x="500" y="250" width="200" height="120" rx="8" fill="#eef2f6" stroke="#555" stroke-width="2"/>
  <text x="600" y="240" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Touch sensor</text>
  <text x="630" y="300" text-anchor="middle" font-size="12" fill="#555">TTP223 module</text>
  <text x="630" y="316" text-anchor="middle" font-size="12" fill="#555">or push button</text>
  <g font-size="13" fill="#222">
    <text x="510" y="284">VCC</text>
    <text x="510" y="314" fill="#ef6c00" font-weight="bold">OUT</text>
    <text x="510" y="344">GND</text>
  </g>
  <!-- wire labels -->
  <g font-size="12" font-weight="bold">
    <text x="372" y="144" fill="#1565c0" text-anchor="start" dx="0">I²C clock</text>
    <text x="300" y="248" fill="#2e7d32">I²C data</text>
    <text x="240" y="292" fill="#ef6c00">touch input</text>
  </g>
</svg>
