; PlatformIO project configuration for MotoWeather Bedside Display
; Target: ESP-01 (ESP8266) with SSD1306 OLED

[platformio]
default_envs = esp01_1m
src_dir = firmware/src
data_dir = firmware/data

[env:esp01_1m]
platform = espressif8266
board = esp01_1m
framework = arduino
build_flags =
    -Ifirmware/include

lib_deps =
    ESP8266WebServer
    adafruit/Adafruit SSD1306 @ ^2.5
    adafruit/Adafruit GFX Library @ ^1.11
    bblanchon/ArduinoJson @ ^7.0
    ESP8266mDNS
    ESP8266HTTPUpdateServer

board_build.filesystem = littlefs
upload_speed = 115200
monitor_speed = 115200
board_build.flash_mode = dout
upload_flags = --no-stub

; Development build with on-screen debug status (pio run -e esp01_1m_debug)
[env:esp01_1m_debug]
extends = env:esp01_1m
build_flags =
    ${env:esp01_1m.build_flags}
    -DDISPLAY_STATUS_DEBUG
