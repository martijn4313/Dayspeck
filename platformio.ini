; PlatformIO project configuration for MotoWeather Bedside Display
; Target: ESP-01 (ESP8266) with SSD1306 OLED

[platformio]
default_envs = esp01_1m
src_dir = firmware/src
lib_dir = firmware/lib
data_dir = firmware/data

[env:esp01_1m]
platform = espressif8266@4.2.1
board = esp01_1m
framework = arduino
extra_scripts = pre:tools/pio_version.py
build_flags =
    -Ifirmware/include
    -Wall
    -Wextra
    -Wno-unused-parameter

; ESP8266WebServer, ESP8266mDNS and ESP8266HTTPUpdateServer ship with the framework
lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5
    adafruit/Adafruit GFX Library @ ^1.11
    bblanchon/ArduinoJson @ ^7.0

board_build.filesystem = littlefs
upload_speed = 115200
monitor_speed = 115200
board_build.flash_mode = dout
upload_flags = --no-stub

; Development build with on-screen debug status (pio run -e esp01_1m_debug)
[env:esp01_1m_debug]
extends = env:esp01_1m
build_flags =
    ${env:esp01_1m.build_flags}
    -DDISPLAY_STATUS_DEBUG

; Host-side unit tests of the pure logic in firmware/lib/motologic (pio test -e native)
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall -Wextra
